<!-- Loading Overlay / Spinner Component -->
<div id="expertLoadingModal" class="loading-modal-backdrop" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); z-index: 10000; justify-content: center; align-items: center;">
  <div class="loading-modal-box" style="background: var(--bg-surface); border-radius: var(--radius-xl); padding: 3rem; text-align: center; max-width: 440px; box-shadow: 0 25px 50px rgba(0,0,0,0.35); border: 1px solid var(--border-color);">
    <div class="spinner-core" style="width: 70px; height: 70px; margin: 0 auto 1.5rem; border: 5px solid var(--primary-100); border-top-color: var(--primary-600); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
    
    <h3 style="font-size: 1.35rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-main);">
      Hệ Chuyên Gia Đang Suy Diễn...
    </h3>
    <p id="loadingStatusText" style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6;">
      Đang chuẩn hóa điểm học bạ và khớp luật RIASEC...
    </p>

    <div style="margin-top: 1.5rem; background: var(--bg-surface-alt); height: 6px; border-radius: 3px; overflow: hidden;">
      <div id="loadingProgressLine" style="height: 100%; width: 20%; background: var(--grad-primary); transition: width 0.3s ease;"></div>
    </div>
  </div>
</div>

<style>
@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
